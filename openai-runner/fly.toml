app = "ai-quota-openai"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  CODEX_HOME = "/data/codex"
  PORT = "8080"
  WARMUP_DATA_DIR = "/data"

[[mounts]]
  source = "codex_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

name = "quota-warmup"
main = "src/index.ts"
compatibility_date = "2026-09-04"

# No public route. Cron triggers fire regardless, and the fetch handler only
# ever served /health and the optional debug trigger — neither worth exposing
# on a guessable *.workers.dev URL. Inspect state with `wrangler tail` or the
# Workers Logs dashboard instead. Flip to true (and redeploy) to get the
# endpoints back temporarily.
workers_dev = false

# Persists console output to Workers Logs so past cron runs are browsable in the
# dashboard. Without this, logs only exist live in `wrangler tail`.
[observability]
enabled = true

[triggers]
# Ticks often; the Worker itself decides whether a ping is due. Most ticks are
# a KV read and nothing else. This is what makes a late trigger survivable —
# see the header comment in src/index.ts.
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "WARMUP_STATE"
# Paste the id printed by `wrangler kv namespace create WARMUP_STATE`.
id = "6dfb93bbe33643778a398483d1de84e9"

[vars]
# Comma-separated providers. `claude` is the default; use `claude,openai` to
# warm both subscriptions on each due target.
WARMUP_PROVIDERS = "claude,openai"

# Optional model override when WARMUP_PROVIDERS includes `openai`. The code defaults to
# gpt-5.2; keep this in vars so it can be changed without a code deploy.
# GPT_MODEL = "gpt-5.2"
# Local wall-clock times to anchor each 5h window to, interpreted in
# TARGET_TIMEZONE below. 24h isn't divisible by 5, so four leave a
# deliberate ~9h gap overnight in exchange for stable boundaries.
TARGETS_LOCAL = "06:00,11:00,16:00,21:00"

# IANA zone the times above are read in — set this to your own zone. The
# Worker resolves each target's actual UTC offset per day via Intl, so this
# tracks DST automatically.
TARGET_TIMEZONE = "UTC"

# How long after a target we keep retrying if the previous window is still open.
# Must stay below the gap between targets.
CATCHUP_HORIZON_MINUTES = "240"

# Set to "false" once the warmup is proven, to drop per-attempt logging and the
# routine "no-target" skip lines.
VERBOSE = "true"
